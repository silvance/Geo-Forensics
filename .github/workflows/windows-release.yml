name: Windows Release

# Builds the Windows installer (NSIS) and the portable single-file exe.
# Runs on demand, on version tags (v*), and once on PRs that change this
# workflow so packaging changes are validated before merge.
on:
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - '.github/workflows/windows-release.yml'
      - 'src/package.json'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build installer and portable exe
        run: npx electron-builder --win --publish never

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GeoForensics-windows
          path: |
            src/release/*.exe
            src/release/*.blockmap
            src/release/latest.yml
          if-no-files-found: error

      # Release notes come from the matching "## X.Y.Z" section of CHANGELOG.md
      - name: Extract release notes from CHANGELOG.md
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        working-directory: .
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            /^## / { if (found) exit; if ($2 == v) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No CHANGELOG.md section for $version; using a placeholder" >&2
            echo "See CHANGELOG.md for the changes in $version." > release-notes.md
          fi
          cat release-notes.md

      # On a version tag, attach the binaries to a draft GitHub release.
      # latest.yml + blockmap are what electron-updater reads, so publishing
      # them enables auto-updates for installed copies.
      - name: Attach to draft GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          body_path: release-notes.md
          files: |
            src/release/*.exe
            src/release/*.blockmap
            src/release/latest.yml
